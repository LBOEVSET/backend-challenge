name: Build & Deploy Backend Challenge

on:
  push:
    branches: [dev]

env:
  PROJECT_ID: agentassistant-496719
  REGISTRY:   asia-southeast1-docker.pkg.dev/agentassistant-496719/assignment
  IMAGE:      backend-challenge
  DEPLOY:     backend-challenge
  NS:         assignment

jobs:
  # ── Job 1: Test + SonarQube scan ──────────────────────────────────────────
  test-and-scan:
    name: Test & SonarQube scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarQube needs full history for blame annotations

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: |
          # -coverpkg makes Go measure coverage in the application packages
          # even though the test files live in test/service (external test package).
          go test ./... \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg=./internal/application/...,./internal/domain/...,./pkg/...,./test/service/...
          # Check overall coverage is at least 70%
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the required 70% threshold."
            echo "::notice::Fix: add tests for uncovered code paths, then re-push."
            exit 1
          fi

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_URL }}

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_URL }}
        # Fails the build if Quality Gate is RED.
        # Common causes and fixes:
        #   Bugs / Vulnerabilities  → see SonarQube dashboard for issue details
        #   Coverage on new code < 70% → add tests for the changed lines
        #   Security hotspots       → review & mark as safe or fix in code

  # ── Job 2: Build & deploy (only when scan passes) ─────────────────────────
  build-and-deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    needs: test-and-scan   # gated: scan must pass first
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id:     ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug:  ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug:      dev
          export-type:   env

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id:                 ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location:     ${{ secrets.GKE_ZONE }}
          project_id:   ${{ secrets.GCP_PROJECT_ID }}

      - name: Sync secrets to GKE
        run: |
          kubectl create secret generic backend-challenge-secret \
            --namespace=${{ env.NS }} \
            --from-literal=MONGODB_URI="${MONGODB_URI}" \
            --from-literal=MONGODB_DB="${MONGODB_DB}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Build & push Docker image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest \
            --push .

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/${{ env.DEPLOY }} \
            ${{ env.IMAGE }}=${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
            -n ${{ env.NS }}
          kubectl rollout status deployment/${{ env.DEPLOY }} \
            -n ${{ env.NS }} --timeout=120s
