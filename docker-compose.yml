services:
  api:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017
      MONGODB_DB:  ${MONGODB_DB:-assignment}
      JWT_SECRET:  ${JWT_SECRET}
      PORT:        "8080"
      GRPC_PORT:   "9090"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER}", "-p", "${MONGO_PASS}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
