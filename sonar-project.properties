sonar.projectKey=backend-challenge
sonar.projectName=Backend Challenge
sonar.projectVersion=1.0

# Source
sonar.sources=.
sonar.inclusions=**/*.go
sonar.exclusions=**/*_test.go,**/vendor/**,**/*.pb.go,internal/adapter/mongodb/**,internal/adapter/grpc/**,cmd/**,test/mock/**

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage (generated by go test -coverprofile)
sonar.go.coverage.reportPaths=coverage.out

# Test execution report (generated by gotestsum --junitfile)
# Enables the "Tests" metric in SonarQube: counts passed / failed / skipped.
sonar.go.tests.reportPaths=test-report.xml

# Encoding
sonar.sourceEncoding=UTF-8
