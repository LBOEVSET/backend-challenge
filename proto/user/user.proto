syntax = "proto3";

package user;

option go_package = "github.com/lboevset/backend-challenge/proto/user;userpb";

// UserService exposes CreateUser and GetUser over gRPC.
// To enable: run `make proto` then build with -tags grpc.
service UserService {
  rpc CreateUser (CreateUserRequest)  returns (CreateUserResponse);
  rpc GetUser    (GetUserRequest)     returns (GetUserResponse);
}

message CreateUserRequest {
  string name     = 1;
  string email    = 2;
  string password = 3;
}

message CreateUserResponse {
  string id         = 1;
  string name       = 2;
  string email      = 3;
  string created_at = 4;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  string id         = 1;
  string name       = 2;
  string email      = 3;
  string created_at = 4;
}
