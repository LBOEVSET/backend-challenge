sonar.projectKey=backend-challenge
sonar.projectName=Backend Challenge
sonar.projectVersion=1.0

# Source
sonar.sources=.
sonar.inclusions=**/*.go
sonar.exclusions=**/*_test.go,**/vendor/**,**/*.pb.go

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage (generated by go test -coverprofile)
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8
